<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">仕事を楽にしたい人へ、4本</title>
  <desc id="desc">「メール、資料、Excelなどの仕事をAIで楽にしたい」という読者に当たる記事の一覧。Excelの式は関数名が思い出せないとき、議事録は会議のメモを形にしたいとき、資料の構成案は何から書くか決まらないとき、英文メールは日本語のあいまいさが化けるときに読む。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">FOR WORK</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">仕事を楽にしたい人へ、4本</text>

    <rect x="70" y="195" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="263" fill="#d36542" font-size="40" font-weight="700">Excelの式</text>
    <text x="470" y="263" fill="#24231f" font-size="36">関数名が思い出せないとき</text>

    <rect x="70" y="315" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="383" fill="#d36542" font-size="40" font-weight="700">議事録</text>
    <text x="470" y="383" fill="#24231f" font-size="36">会議のメモを形にしたいとき</text>

    <rect x="70" y="435" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="503" fill="#d36542" font-size="40" font-weight="700">資料の構成案</text>
    <text x="470" y="503" fill="#24231f" font-size="36">何から書くか決まらないとき</text>

    <rect x="70" y="555" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="623" fill="#d36542" font-size="40" font-weight="700">英文メール</text>
    <text x="470" y="623" fill="#24231f" font-size="36">日本語のあいまいさが化けるとき</text>
  </g>
</svg>
