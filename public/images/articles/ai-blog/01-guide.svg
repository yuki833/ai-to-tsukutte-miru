<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">このガイドのゴール</title><desc id="d">6つの工程を進めて自分のブログサイトを作りインターネットへ公開する</desc><rect width="1200" height="630" rx="36" fill="#edf5f1"/><text x="65" y="82" fill="#0a7a66" font-family="sans-serif" font-size="27" font-weight="700">GOAL OF THIS GUIDE</text><text x="600" y="165" text-anchor="middle" fill="#17221f" font-family="sans-serif" font-size="44" font-weight="700">自分のブログサイトを作り、インターネットへ公開する</text><g font-family="sans-serif" font-weight="700" text-anchor="middle"><g fill="white"><rect x="50" y="260" width="165" height="125" rx="20"/><rect x="235" y="260" width="165" height="125" rx="20"/><rect x="420" y="260" width="165" height="125" rx="20"/><rect x="605" y="260" width="165" height="125" rx="20"/><rect x="790" y="260" width="165" height="125" rx="20"/><rect x="975" y="260" width="175" height="125" rx="20" fill="#0a7a66"/></g><g fill="#5168d8" font-size="19"><text x="132" y="295">STEP 1</text><text x="317" y="295">STEP 2</text><text x="502" y="295">STEP 3</text><text x="687" y="295">STEP 4</text><text x="872" y="295">STEP 5</text><text x="1062" y="295" fill="white">STEP 6</text></g><g fill="#17221f" font-size="22"><text x="132" y="342">企画</text><text x="317" y="342">技術を決める</text><text x="502" y="342">環境を作る</text><text x="687" y="342">サイト作成</text><text x="872" y="342">コード保存</text><text x="1062" y="342" fill="white">公開</text></g></g><text x="600" y="500" text-anchor="middle" fill="#5f6f69" font-family="sans-serif" font-size="25">この記事のプロンプトと操作手順を、STEP 1から順番に進めます</text></svg>
