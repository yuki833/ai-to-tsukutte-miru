<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">このガイドのゴール</title><desc id="d">AIと一緒に自分のブログサイトを作り、インターネットへ公開する</desc><rect width="1200" height="630" rx="36" fill="#edf5f1"/><text x="80" y="105" fill="#0a7a66" font-family="sans-serif" font-size="28" font-weight="700">GOAL OF THIS GUIDE</text><text x="600" y="235" text-anchor="middle" fill="#17221f" font-family="sans-serif" font-size="48" font-weight="700">AIと一緒にブログサイトを作る</text><path d="M260 335H940" stroke="#0a7a66" stroke-width="8" stroke-linecap="round"/><circle cx="260" cy="335" r="72" fill="white"/><text x="260" y="345" text-anchor="middle" fill="#17221f" font-family="sans-serif" font-size="29" font-weight="700">企画</text><circle cx="600" cy="335" r="72" fill="#dce3ff"/><text x="600" y="345" text-anchor="middle" fill="#17221f" font-family="sans-serif" font-size="29" font-weight="700">作成</text><circle cx="940" cy="335" r="72" fill="#0a7a66"/><text x="940" y="345" text-anchor="middle" fill="white" font-family="sans-serif" font-size="29" font-weight="700">公開</text><text x="600" y="520" text-anchor="middle" fill="#5f6f69" font-family="sans-serif" font-size="26">6つの工程を順番に進めれば、自分のブログを公開できる</text></svg>
