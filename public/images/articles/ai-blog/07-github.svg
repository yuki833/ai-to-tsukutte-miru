<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t"><title id="t">GitHubで変更履歴を管理する流れ</title><rect width="1200" height="630" rx="36" fill="#f4f6ff"/><text x="70" y="90" fill="#5168d8" font-family="sans-serif" font-size="28" font-weight="700">GIT &amp; GITHUB</text><g font-family="sans-serif" text-anchor="middle" font-weight="700"><rect x="85" y="210" width="250" height="180" rx="24" fill="white"/><text x="210" y="280" fill="#17221f" font-size="29">ファイルを変更</text><text x="210" y="335" fill="#5f6f69" font-size="22">VS Code</text><text x="385" y="310" fill="#5168d8" font-size="42">→</text><rect x="455" y="210" width="250" height="180" rx="24" fill="#dff2ec"/><text x="580" y="275" fill="#17221f" font-size="29">変更を記録</text><text x="580" y="330" fill="#0a7a66" font-size="25">git commit</text><text x="755" y="310" fill="#5168d8" font-size="42">→</text><rect x="825" y="210" width="290" height="180" rx="24" fill="#24292f"/><text x="970" y="275" fill="white" font-size="31">GitHubへ送信</text><text x="970" y="330" fill="#dce3ff" font-size="25">git push</text><text x="600" y="495" fill="#5f6f69" font-size="24">コードに秘密情報を入れないことを、人が確認する</text></g></svg>
