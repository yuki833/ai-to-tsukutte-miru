<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">表の形を伝え、条件を分けて書き、出てきた式を小さいデータで確かめる</title>
  <desc id="desc">Excelの式をAIに書かせる3つの手順。どの列に何が入っているかを伝え、条件を箇条書きで分けて書き、返ってきた式を正解の分かる小さいデータで検算する流れを並べた図</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">HOW TO ASK</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">頼み方は、3つに分ける</text>

  <g font-family="sans-serif">
    <rect x="74" y="182" width="330" height="212" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="124" cy="232" r="22" fill="#d36542"/>
    <text x="124" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="104" y="298" fill="#24231f" font-size="26" font-weight="700">表の形を伝える</text>
    <text x="104" y="336" fill="#5c534a" font-size="19">A列：日付　B列：担当者</text>
    <text x="104" y="366" fill="#5c534a" font-size="19">C列：分類　D列：金額</text>

    <path d="M416 288 L470 288" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M462 280 L474 288 L462 296 Z" fill="#b8ae9a"/>

    <rect x="486" y="182" width="330" height="212" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="536" cy="232" r="22" fill="#d36542"/>
    <text x="536" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="516" y="298" fill="#24231f" font-size="26" font-weight="700">条件を分けて書く</text>
    <text x="516" y="336" fill="#5c534a" font-size="19">・担当者が「田中」</text>
    <text x="516" y="366" fill="#5c534a" font-size="19">・分類が「備品」　ほか</text>

    <path d="M828 288 L882 288" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M874 280 L886 288 L874 296 Z" fill="#b8ae9a"/>

    <rect x="898" y="182" width="228" height="212" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <circle cx="948" cy="232" r="22" fill="#2f6b4f"/>
    <text x="948" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="928" y="298" fill="#24231f" font-size="26" font-weight="700">確かめる</text>
    <text x="928" y="336" fill="#2f6b4f" font-size="19" font-weight="700">正解が分かる</text>
    <text x="928" y="366" fill="#2f6b4f" font-size="19" font-weight="700">小さいデータで</text>

    <rect x="74" y="428" width="1052" height="180" rx="20" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="114" y="476" fill="#d36542" font-size="22" font-weight="700">3番目を省くと、こうなる</text>
    <text x="114" y="522" fill="#24231f" font-size="24" font-weight="700">条件が1つ落ちても、式はエラーになりません。</text>
    <text x="114" y="560" fill="#24231f" font-size="24" font-weight="700">数字が出ます。しかも、それらしい数字が。</text>
    <text x="114" y="592" fill="#7a7362" font-size="19">正解を知らなければ、大きいか小さいかも分かりません。</text>
  </g>
</svg>
