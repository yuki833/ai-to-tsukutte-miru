<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">この記事の前後に読むもの</title>
  <desc id="desc">前に読むのは資料作成の記事。出てきた文字をファイルへ戻すならプレゼン資料の記事。あわせて読むのは長い文章の要約の記事と、AIの答えを確かめた記事。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">NEXT</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">この記事の前後に読むもの</text>

    <rect x="70" y="195" width="1060" height="100" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="238" fill="#8a8578" font-size="36">前に読む</text>
    <text x="110" y="278" fill="#24231f" font-size="38" font-weight="700">資料作成　構成案を作らせる指示文</text>

    <rect x="70" y="310" width="1060" height="100" rx="24" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="110" y="353" fill="#2f6b4f" font-size="36">次に読む</text>
    <text x="110" y="393" fill="#24231f" font-size="38" font-weight="700">プレゼン資料　ファイルへ流し込む</text>

    <rect x="70" y="425" width="1060" height="100" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="468" fill="#8a8578" font-size="36">あわせて読む</text>
    <text x="110" y="508" fill="#24231f" font-size="38" font-weight="700">要約　落とさない頼み方</text>

    <rect x="70" y="540" width="1060" height="100" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="583" fill="#8a8578" font-size="36">あわせて読む</text>
    <text x="110" y="623" fill="#24231f" font-size="38" font-weight="700">AIの答えを確かめた記録</text>
  </g>
</svg>
