<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">この記事は、既存2本と向きが逆</title>
  <desc id="desc">既存の2本はメモからスライドの文字を作り、その文字からファイルを作る向き。この記事はもうあるスライドの文字を材料にして、書き直した文字を出す向き。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">DIRECTION</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">この記事は、既存2本と向きが逆</text>

    <rect x="70" y="205" width="1060" height="120" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="255" fill="#8a8578" font-size="36">構成案を作らせる</text>
    <text x="110" y="305" fill="#24231f" font-size="40" font-weight="700">頭の中のメモ　→　スライドの文字</text>

    <rect x="70" y="340" width="1060" height="120" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="390" fill="#8a8578" font-size="36">PowerPointへ流し込む</text>
    <text x="110" y="440" fill="#24231f" font-size="40" font-weight="700">スライドの文字　→　ファイル</text>

    <rect x="70" y="475" width="1060" height="130" rx="24" fill="#fff" stroke="#2f6b4f" stroke-width="4"/>
    <text x="110" y="528" fill="#2f6b4f" font-size="36" font-weight="700">この記事</text>
    <text x="110" y="580" fill="#24231f" font-size="40" font-weight="700">もうあるスライドの文字　→　書き直した文字</text>
  </g>
</svg>
