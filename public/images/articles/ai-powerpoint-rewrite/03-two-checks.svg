<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">確かめる向きは、引き算と足し算の2つ</title>
  <desc id="desc">引き算は元にあった条件が黙って消えていないかを見る向きで、出てきた3枚だけを読んでも気づけない。足し算は元に無かった数字や決定事項が増えていないかを見る向き。作り直しでは引き算のほうが見落としやすい。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">CHECK</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">確かめる向きは2つある</text>

    <rect x="70" y="200" width="1060" height="185" rx="24" fill="#fff" stroke="#d36542" stroke-width="4"/>
    <text x="110" y="262" fill="#d36542" font-size="44" font-weight="700">引き算　落ちていないか</text>
    <text x="110" y="316" fill="#24231f" font-size="36">元にあった条件が、黙って消えていないか</text>
    <text x="110" y="362" fill="#8a8578" font-size="36">出てきた3枚だけを読んでも気づけない</text>

    <rect x="70" y="410" width="1060" height="185" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="472" fill="#2f6b4f" font-size="44" font-weight="700">足し算　増えていないか</text>
    <text x="110" y="526" fill="#24231f" font-size="36">元に無い数字や決定事項が、増えていないか</text>
    <text x="110" y="572" fill="#8a8578" font-size="36">元の文字と突き合わせれば見つかる</text>

    <text x="70" y="648" fill="#24231f" font-size="36" font-weight="700">作り直しでは、引き算のほうが見落としやすい</text>
  </g>
</svg>
