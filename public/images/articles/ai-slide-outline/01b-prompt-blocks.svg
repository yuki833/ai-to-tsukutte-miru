<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">指示文は4つの塊でできている</title>
  <desc id="desc">コピーして使う指示文の組み立て。条件には相手・目的・説明時間・ページ数を書く。材料のメモは困りごと・提案・未確認に分けて渡す。出力の形では見出しと伝えたいことと書く内容を指定する。守ることでメモに無いことを作らせない。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">PROMPT</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">指示文は4つの塊でできている</text>

    <rect x="70" y="195" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="263" fill="#d36542" font-size="40" font-weight="700">【条件】</text>
    <text x="430" y="263" fill="#24231f" font-size="36">相手・目的・説明時間・ページ数</text>

    <rect x="70" y="315" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="383" fill="#d36542" font-size="40" font-weight="700">【材料】</text>
    <text x="430" y="383" fill="#24231f" font-size="36">困りごと／提案／未確認 に分ける</text>

    <rect x="70" y="435" width="1060" height="110" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="503" fill="#d36542" font-size="40" font-weight="700">【出力】</text>
    <text x="430" y="503" fill="#24231f" font-size="36">見出し・伝えたいこと・書く内容</text>

    <rect x="70" y="555" width="1060" height="110" rx="24" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="110" y="623" fill="#2f6b4f" font-size="40" font-weight="700">【守る】</text>
    <text x="430" y="623" fill="#24231f" font-size="36">メモに無いことを作らせない</text>
  </g>
</svg>
