<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">返ってきたレポートで確かめた4つの場所</title>
  <desc id="desc">計算は5つの式とも合っていた。材料に無い数字は無かった。返信時間は測り方が違うので比べなかった。材料に無い目的は作らずに要確認と書いた。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">CHECK</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">確かめる場所は4つ</text>

    <rect x="70" y="190" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="250" fill="#d36542" font-size="36" font-weight="700">計算</text>
    <text x="520" y="250" fill="#24231f" font-size="36">5つの式とも合っていた</text>

    <rect x="70" y="300" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="360" fill="#d36542" font-size="36" font-weight="700">材料に無い数字</text>
    <text x="520" y="360" fill="#24231f" font-size="36">無かった</text>

    <rect x="70" y="410" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="470" fill="#d36542" font-size="36" font-weight="700">比べられない数字</text>
    <text x="520" y="470" fill="#24231f" font-size="36">返信時間は比べなかった</text>

    <rect x="70" y="520" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="580" fill="#d36542" font-size="36" font-weight="700">材料に無い目的</text>
    <text x="520" y="580" fill="#24231f" font-size="36">作らずに「要確認」と書いた</text>
  </g>
</svg>
