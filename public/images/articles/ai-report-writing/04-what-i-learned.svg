<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AIに任せられたことと、人が埋めること</title>
  <desc id="desc">AIに任せられたのは、計算と式を書くことと、比べられない数字を見分けること。人が埋めるのは、取り組みの目的と、試す前の期間の日付と日数。要点に並んだ数字は人が直す。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">LEARNED</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">任せられたこと、埋めること</text>

    <rect x="70" y="200" width="1060" height="185" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="262" fill="#2f6b4f" font-size="44" font-weight="700">AIに任せられた</text>
    <text x="110" y="316" fill="#24231f" font-size="36">計算と、式を書くこと</text>
    <text x="110" y="362" fill="#24231f" font-size="36">比べられない数字を見分けること</text>

    <rect x="70" y="410" width="1060" height="185" rx="24" fill="#fff" stroke="#d36542" stroke-width="4"/>
    <text x="110" y="472" fill="#d36542" font-size="44" font-weight="700">人が埋める</text>
    <text x="110" y="526" fill="#24231f" font-size="36">取り組みの目的</text>
    <text x="110" y="572" fill="#24231f" font-size="36">試す前の期間の日付と日数</text>

    <text x="70" y="648" fill="#24231f" font-size="36" font-weight="700">要点に並んだ数字は、人が直す</text>
  </g>
</svg>
