<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">この記事のあとに読む記事</title>
  <desc id="desc">メモそのものを作るなら議事録の記事、もっと短くしたいなら要約の記事、数字を確かめる考え方ならAIの答えを確かめた記事、社内の数字を貼る前には社名と金額を伏せて貼る記事。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <g font-family="sans-serif">
    <text x="70" y="86" fill="#d36542" font-size="36" font-weight="700" letter-spacing="4">NEXT</text>
    <text x="70" y="152" fill="#24231f" font-size="52" font-weight="700">次に読むなら</text>

    <rect x="70" y="190" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="250" fill="#d36542" font-size="36" font-weight="700">メモから作るなら</text>
    <text x="560" y="250" fill="#24231f" font-size="36">議事録をAIに書かせる</text>

    <rect x="70" y="300" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="360" fill="#d36542" font-size="36" font-weight="700">もっと短くするなら</text>
    <text x="560" y="360" fill="#24231f" font-size="36">長い文章をAIに要約させる</text>

    <rect x="70" y="410" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="470" fill="#d36542" font-size="36" font-weight="700">確かめ方を知るなら</text>
    <text x="560" y="470" fill="#24231f" font-size="36">AIの答えを確かめた記録</text>

    <rect x="70" y="520" width="1060" height="95" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="580" fill="#d36542" font-size="36" font-weight="700">社内の数字を貼る前に</text>
    <text x="560" y="580" fill="#24231f" font-size="36">社名と金額を伏せて貼る</text>
  </g>
</svg>
