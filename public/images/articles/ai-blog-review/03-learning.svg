<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t"><title id="t">制作から得た学び</title><rect width="1200" height="630" rx="36" fill="#172d27"/><text x="70" y="95" fill="#79d0ba" font-family="sans-serif" font-size="28" font-weight="700">WHAT I LEARNED</text><g font-family="sans-serif" text-anchor="middle"><text x="600" y="220" fill="white" font-size="48" font-weight="700">AIがあれば、迷わない？</text><text x="600" y="305" fill="#79d0ba" font-size="52" font-weight="700">いいえ。迷い方が変わる。</text><text x="600" y="410" fill="#c6d5cf" font-size="27">AIが選択肢を出し、人が理由を理解して決める。</text><text x="600" y="470" fill="#c6d5cf" font-size="27">エラーは消えない。でも、次の一手を選びやすくなる。</text></g></svg>
