<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">アウトラインで入るのは見出しと箇条書きだけ。表紙のレイアウト、デザイン、図と写真は入らないので、読み込んだあとに人が当てる</title>
  <desc id="desc">アウトラインからスライドで入るものと入らないものを左右に分けた図。入るのは見出しと箇条書きの文字だけで、1枚目も表紙のレイアウトにはならず、デザインや配色、図や表や写真は入らない。読み込んだあとに表紙のレイアウトを変えてテーマを当てる作業が2、3分残ることを示している</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">WHAT I LEARNED</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">入るのは文字だけ。見た目は残る</text>

  <g font-family="sans-serif">
    <rect x="74" y="176" width="506" height="286" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <circle cx="124" cy="226" r="22" fill="#2f6b4f"/>
    <text x="124" y="235" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">○</text>
    <text x="164" y="236" fill="#2f6b4f" font-size="26" font-weight="700">そのまま入る</text>
    <text x="110" y="298" fill="#24231f" font-size="24" font-weight="700">見出し（行頭から書いた行）</text>
    <text x="110" y="344" fill="#24231f" font-size="24" font-weight="700">箇条書き（タブで下げた行）</text>
    <text x="110" y="396" fill="#5c534a" font-size="19">タブで下げた行は、本文の枠に</text>
    <text x="110" y="424" fill="#5c534a" font-size="19">箇条書きとして収まりました。</text>

    <rect x="620" y="176" width="506" height="286" rx="20" fill="#fff" stroke="#d36542" stroke-width="3"/>
    <circle cx="670" cy="226" r="22" fill="#d36542"/>
    <text x="670" y="235" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">×</text>
    <text x="710" y="236" fill="#d36542" font-size="26" font-weight="700">入らない</text>
    <text x="656" y="288" fill="#24231f" font-size="24" font-weight="700">表紙のレイアウト</text>
    <text x="656" y="330" fill="#24231f" font-size="24" font-weight="700">デザイン・配色</text>
    <text x="656" y="372" fill="#24231f" font-size="24" font-weight="700">図・表・写真</text>
    <text x="656" y="424" fill="#5c534a" font-size="19">1枚目も「タイトルとコンテンツ」で入ります。</text>

    <rect x="74" y="492" width="1052" height="140" rx="20" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="114" y="534" fill="#d36542" font-size="22" font-weight="700">読み込んだあとに残る作業</text>
    <text x="114" y="576" fill="#24231f" font-size="24" font-weight="700">1枚目を表紙のレイアウトに変えて、「デザイン」タブからテーマを当てる。</text>
    <text x="114" y="612" fill="#7a7362" font-size="19">ここは手で2〜3分です。減ったのは、貼り付けを繰り返す時間のほうです。</text>
  </g>
</svg>
