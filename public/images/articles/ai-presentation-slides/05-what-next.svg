<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">この記事の前に読むのは資料作成の記事、材料をそろえるなら議事録の記事、あわせて読むのはAIの答えを確かめた記事で、次に書くのは要約の記事</title>
  <desc id="desc">この記事の前後関係を示した図。前の工程は資料作成をAIに頼む記事で、そこで作った構成案がこの記事の材料になる。さらに前の材料をそろえるのが議事録の記事。あわせて読むのはAIの答えを確かめた記事で、動いているように見えるものを信じない話が共通している。次に書くのは長い文章の要約の記事</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">WHAT NEXT</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">材料をそろえる → 順番を作る → 流し込む</text>

  <g font-family="sans-serif">
    <rect x="74" y="186" width="300" height="150" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="104" y="228" fill="#7a7362" font-size="18" font-weight="700">材料をそろえる</text>
    <text x="104" y="268" fill="#24231f" font-size="24" font-weight="700">議事録をAIに</text>
    <text x="104" y="300" fill="#24231f" font-size="24" font-weight="700">書かせる</text>

    <path d="M386 261 L432 261" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M424 253 L436 261 L424 269 Z" fill="#b8ae9a"/>

    <rect x="448" y="186" width="300" height="150" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="478" y="228" fill="#7a7362" font-size="18" font-weight="700">順番を作る</text>
    <text x="478" y="268" fill="#24231f" font-size="24" font-weight="700">資料作成を</text>
    <text x="478" y="300" fill="#24231f" font-size="24" font-weight="700">AIに頼む</text>

    <path d="M760 261 L806 261" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M798 253 L810 261 L798 269 Z" fill="#b8ae9a"/>

    <rect x="822" y="186" width="304" height="150" rx="18" fill="#eaf3ee" stroke="#2f6b4f" stroke-width="3"/>
    <text x="852" y="228" fill="#2f6b4f" font-size="18" font-weight="700">いまここ</text>
    <text x="852" y="268" fill="#24231f" font-size="24" font-weight="700">PowerPointへ</text>
    <text x="852" y="300" fill="#24231f" font-size="24" font-weight="700">流し込む</text>

    <rect x="74" y="376" width="526" height="152" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="106" y="418" fill="#7a7362" font-size="18" font-weight="700">あわせて読む</text>
    <text x="106" y="458" fill="#24231f" font-size="24" font-weight="700">AIの「たぶん壊れています」を確かめたら</text>
    <text x="106" y="500" fill="#5c534a" font-size="19">動いているように見えるものを、そのまま信じない</text>

    <rect x="624" y="376" width="502" height="152" rx="18" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="656" y="418" fill="#d36542" font-size="18" font-weight="700">次に書く</text>
    <text x="656" y="458" fill="#24231f" font-size="24" font-weight="700">長い文章をAIに要約させる</text>
    <text x="656" y="500" fill="#5c534a" font-size="19">メール・資料・議事録のすべてに効きます</text>

    <rect x="74" y="560" width="1052" height="72" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="114" y="605" fill="#24231f" font-size="24" font-weight="700">まずは、この記事のアウトラインをそのまま1回読み込んでみてください。5枚になれば、通っています。</text>
  </g>
</svg>
