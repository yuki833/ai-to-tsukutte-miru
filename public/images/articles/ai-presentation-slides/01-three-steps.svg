<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AIにアウトライン形式で出させ、メモ帳で文字コードを変えて保存し、PowerPointのアウトラインからスライドで読み込む3つの流れ。つまずくのは保存のところだけ</title>
  <desc id="desc">AIが書いた資料の下書きをPowerPointへ流し込む3つの手順。1つ目はAIにタブで字下げしたアウトライン形式で出させること、2つ目はメモ帳に貼って文字コードをUTF-16 LEにして保存すること、3つ目はPowerPointのアウトラインからスライドで読み込むこと。2つ目だけが失敗しやすいことを示した図</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">HOW TO PASTE</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">貼るのは1回。あとはPowerPointが並べる</text>

  <g font-family="sans-serif">
    <rect x="74" y="182" width="330" height="212" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="124" cy="232" r="22" fill="#d36542"/>
    <text x="124" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="104" y="298" fill="#24231f" font-size="26" font-weight="700">アウトラインで出す</text>
    <text x="104" y="336" fill="#5c534a" font-size="19">見出しは行頭から</text>
    <text x="104" y="366" fill="#5c534a" font-size="19">中身はタブ1つ下げる</text>

    <path d="M416 288 L470 288" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M462 280 L474 288 L462 296 Z" fill="#b8ae9a"/>

    <rect x="486" y="182" width="330" height="212" rx="20" fill="#fdf6f3" stroke="#d36542" stroke-width="3"/>
    <circle cx="536" cy="232" r="22" fill="#d36542"/>
    <text x="536" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="516" y="298" fill="#24231f" font-size="26" font-weight="700">文字コードを変える</text>
    <text x="516" y="336" fill="#d36542" font-size="19" font-weight="700">メモ帳に貼って</text>
    <text x="516" y="366" fill="#d36542" font-size="19" font-weight="700">UTF-16 LE で保存</text>

    <path d="M828 288 L882 288" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M874 280 L886 288 L874 296 Z" fill="#b8ae9a"/>

    <rect x="898" y="182" width="228" height="212" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <circle cx="948" cy="232" r="22" fill="#2f6b4f"/>
    <text x="948" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="928" y="298" fill="#24231f" font-size="26" font-weight="700">1回で読み込む</text>
    <text x="928" y="336" fill="#2f6b4f" font-size="19" font-weight="700">アウトラインから</text>
    <text x="928" y="366" fill="#2f6b4f" font-size="19" font-weight="700">スライド</text>

    <rect x="74" y="428" width="1052" height="180" rx="20" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="114" y="476" fill="#d36542" font-size="22" font-weight="700">つまずくのは2番だけ</text>
    <text x="114" y="522" fill="#24231f" font-size="24" font-weight="700">1と3で迷うことはありません。保存のしかたを外すと、</text>
    <text x="114" y="560" fill="#24231f" font-size="24" font-weight="700">「全部が1枚になる」か「日本語が化ける」が起きます。</text>
    <text x="114" y="592" fill="#7a7362" font-size="19">どちらもエラーは出ません。読み込みは成功したことになります。</text>
  </g>
</svg>
