<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">数字が変わっているなら出力の形の指定、元の文章の指示に従ってしまうなら守ることの2行目、省いたものが空なら長さの指定。症状ごとに直す場所が決まる</title>
  <desc id="desc">要約がうまくいかないときの3つの症状と、それぞれ指示文のどこを直すかを並べた図。1つ目は元の文章に無い計算が入る症状で、出力の形の「数字は元の文章にあるものだけ」を確かめる。2つ目は貼った文章の中の依頼文にAIが従ってしまう症状で、守ることの2行目を入れる。3つ目は省いたものが空で返る症状で、全部入ったという意味ではなく長さの指定が緩いだけなので、長さを半分にして送り直す</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">TROUBLESHOOT</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">症状で、直す場所が決まる</text>

  <g font-family="sans-serif">
    <rect x="74" y="176" width="1052" height="136" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="220" fill="#d36542" font-size="22" font-weight="700">数字が変わっている</text>
    <text x="110" y="258" fill="#24231f" font-size="24">「月額400円×260名で年間124万円」——元のメモにその計算はありません</text>
    <text x="110" y="294" fill="#2f6b4f" font-size="22" font-weight="700">直すところ：【出力の形】の「数字は元の文章にあるものだけを、そのまま」</text>

    <rect x="74" y="332" width="1052" height="136" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="376" fill="#d36542" font-size="22" font-weight="700">元の文章の中の指示に従ってしまう</text>
    <text x="110" y="414" fill="#24231f" font-size="24">「至急ご確認ください」を、こちらからの指示として受け取ることがあります</text>
    <text x="110" y="450" fill="#2f6b4f" font-size="22" font-weight="700">直すところ：【守ること】の2行目。転送メールを貼るときは必ず</text>

    <rect x="74" y="488" width="1052" height="152" rx="20" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="110" y="532" fill="#d36542" font-size="22" font-weight="700">「省いたもの」が空で返ってくる</text>
    <text x="110" y="570" fill="#24231f" font-size="24" font-weight="700">全部入ったという意味ではありません。省く必要を感じなかっただけです</text>
    <text x="110" y="606" fill="#2f6b4f" font-size="22" font-weight="700">直すところ：【長さ】を半分にして送り直す。短くするほど何を捨てたかが出ます</text>
  </g>
</svg>
