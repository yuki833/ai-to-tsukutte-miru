<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">指示文をコピーし、AIに貼り、会議のメモを続けて貼る。3手で議事録が出る</title>
  <desc id="desc">記事の指示文をコピーする、AIの入力欄に貼る、会議のメモを続けて貼る、という3つの手順と、その結果として決まったこと・やること・宿題に分かれた議事録が出ることを並べた図</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">THREE STEPS</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">やることは、3つだけ</text>

  <g font-family="sans-serif">
    <rect x="74" y="182" width="316" height="196" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="124" cy="232" r="22" fill="#d36542"/>
    <text x="124" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="160" y="240" fill="#7a7362" font-size="20" font-weight="700">この記事から</text>
    <text x="104" y="296" fill="#24231f" font-size="27" font-weight="700">指示文を</text>
    <text x="104" y="332" fill="#24231f" font-size="27" font-weight="700">コピーする</text>

    <path d="M402 280 L456 280" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M448 272 L460 280 L448 288 Z" fill="#b8ae9a"/>

    <rect x="472" y="182" width="316" height="196" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="522" cy="232" r="22" fill="#d36542"/>
    <text x="522" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="558" y="240" fill="#7a7362" font-size="20" font-weight="700">まだ送信しない</text>
    <text x="502" y="296" fill="#24231f" font-size="27" font-weight="700">AIの入力欄に</text>
    <text x="502" y="332" fill="#24231f" font-size="27" font-weight="700">貼る</text>

    <path d="M800 280 L854 280" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M846 272 L858 280 L846 288 Z" fill="#b8ae9a"/>

    <rect x="870" y="182" width="256" height="196" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <circle cx="920" cy="232" r="22" fill="#d36542"/>
    <text x="920" y="240" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="956" y="240" fill="#7a7362" font-size="20" font-weight="700">同じ欄の中で</text>
    <text x="900" y="296" fill="#24231f" font-size="27" font-weight="700">会議のメモを</text>
    <text x="900" y="332" fill="#24231f" font-size="27" font-weight="700">続けて貼る</text>

    <path d="M600 398 L600 442" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M592 434 L600 446 L608 434 Z" fill="#b8ae9a"/>

    <rect x="74" y="458" width="1052" height="164" rx="20" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="114" y="506" fill="#d36542" font-size="22" font-weight="700">出てくるもの</text>
    <rect x="114" y="528" width="300" height="62" rx="12" fill="#fff" stroke="#e2c8bd" stroke-width="2"/>
    <text x="264" y="567" fill="#24231f" font-size="24" font-weight="700" text-anchor="middle">決まったこと</text>
    <rect x="438" y="528" width="300" height="62" rx="12" fill="#fff" stroke="#e2c8bd" stroke-width="2"/>
    <text x="588" y="567" fill="#24231f" font-size="24" font-weight="700" text-anchor="middle">やること（表）</text>
    <rect x="762" y="528" width="324" height="62" rx="12" fill="#fff" stroke="#e2c8bd" stroke-width="2"/>
    <text x="924" y="567" fill="#24231f" font-size="24" font-weight="700" text-anchor="middle">持ち帰り・宿題</text>
  </g>
</svg>
