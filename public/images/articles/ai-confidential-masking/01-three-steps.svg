<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">置き換え表を作り、置き換えて貼り、返ってきた答えを表の逆で戻す3つの流れ。大事なのは1で、表を作らずにその場で伏せると必ずどこかに元の言葉が残る</title>
  <desc id="desc">AIへ社内の文章を貼るときの3つの手順を左から並べた図。1つ目は置き換え表を先に作ること。元の言葉と貼るときの言葉を1行ずつ書く。2つ目は置き換えてから貼るだけで、貼る前に元の言葉が残っていないか検索して確かめる。3つ目は返ってきた答えを表の逆で戻すこと。1が要点で、表を作らずにその場で伏せると必ずどこかに元の言葉が残ることを示している</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">HOW IT GOES</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">先に表を作る。その場で伏せない</text>

  <g font-family="sans-serif">
    <rect x="74" y="176" width="330" height="300" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="106" y="222" fill="#2f6b4f" font-size="20" font-weight="700">1　ここが大事</text>
    <text x="106" y="266" fill="#24231f" font-size="30" font-weight="700">置き換え表を</text>
    <text x="106" y="304" fill="#24231f" font-size="30" font-weight="700">作る</text>
    <text x="106" y="352" fill="#5c534a" font-size="20">元の言葉</text>
    <text x="106" y="384" fill="#5c534a" font-size="20">貼るときの言葉</text>
    <text x="106" y="428" fill="#7a7362" font-size="18">その場で伏せると</text>
    <text x="106" y="456" fill="#7a7362" font-size="18">どこかに残ります</text>

    <rect x="436" y="176" width="330" height="300" rx="20" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="468" y="222" fill="#7a7362" font-size="20" font-weight="700">2　置き換えて貼る</text>
    <text x="468" y="266" fill="#24231f" font-size="30" font-weight="700">貼る前に</text>
    <text x="468" y="304" fill="#24231f" font-size="30" font-weight="700">検索で確かめる</text>
    <text x="468" y="352" fill="#5c534a" font-size="20">左の言葉で1つずつ</text>
    <text x="468" y="384" fill="#5c534a" font-size="20">読み返しでは</text>
    <text x="468" y="416" fill="#5c534a" font-size="20">見つかりません</text>

    <rect x="798" y="176" width="330" height="300" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="830" y="222" fill="#2f6b4f" font-size="20" font-weight="700">3　戻す</text>
    <text x="830" y="266" fill="#24231f" font-size="30" font-weight="700">答えを表の</text>
    <text x="830" y="304" fill="#24231f" font-size="30" font-weight="700">逆で戻す</text>
    <text x="830" y="352" fill="#5c534a" font-size="20">戻したあとに</text>
    <text x="830" y="384" fill="#5c534a" font-size="20">右の言葉でも</text>
    <text x="830" y="416" fill="#5c534a" font-size="20">検索します</text>

    <path d="M410 326 L430 326" stroke="#b9ae99" stroke-width="4"/>
    <path d="M772 326 L792 326" stroke="#b9ae99" stroke-width="4"/>

    <text x="74" y="546" fill="#24231f" font-size="24" font-weight="700">伏せるのは「相手が誰か」。判断に使う数字は残します</text>
    <text x="74" y="588" fill="#5c534a" font-size="20">消しすぎると、返ってくるのは一般論だけになります</text>
  </g>
</svg>
