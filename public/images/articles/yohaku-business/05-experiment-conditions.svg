<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">人間が出した2つの条件と、そこから決めたこと</title>
  <desc id="desc">「AIだけでほぼ自走できるもの」という条件から物販ではなくWebツールを選び、「無料で始められて学習コストも低いもの」という条件から有料販売を目指さず無料で公開する方針にした、という2組の対応を示した図</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">CONDITIONS</text>
  <text x="74" y="128" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">人間が出した2つの条件</text>

  <g font-family="sans-serif">
    <text x="88" y="180" fill="#7a7362" font-size="22" font-weight="700">人間が言ったこと</text>
    <text x="686" y="180" fill="#7a7362" font-size="22" font-weight="700">そこから決めたこと</text>

    <rect x="74" y="198" width="500" height="196" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="272" fill="#24231f" font-size="27" font-weight="700">「AIだけでほぼ自走、</text>
    <text x="110" y="316" fill="#24231f" font-size="27" font-weight="700">改善できるものがいい」</text>

    <path d="M594 288 L644 288" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M636 279 L650 288 L636 297 Z" fill="#b8ae9a"/>

    <rect x="672" y="198" width="454" height="196" rx="18" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="708" y="262" fill="#24231f" font-size="27" font-weight="700">物販ではなくWebツール</text>
    <text x="708" y="306" fill="#24231f" font-size="24">在庫・発送・仕入れを</text>
    <text x="708" y="342" fill="#24231f" font-size="24">増やさずに済む</text>

    <rect x="74" y="424" width="500" height="196" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="110" y="498" fill="#24231f" font-size="27" font-weight="700">「無料で始められて、</text>
    <text x="110" y="542" fill="#24231f" font-size="27" font-weight="700">学習コストも低いもの」</text>

    <path d="M594 514 L644 514" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M636 505 L650 514 L636 523 Z" fill="#b8ae9a"/>

    <rect x="672" y="424" width="454" height="196" rx="18" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="708" y="488" fill="#24231f" font-size="27" font-weight="700">まず無料で公開する</text>
    <text x="708" y="532" fill="#24231f" font-size="24">決済を作るより、本当に</text>
    <text x="708" y="568" fill="#d36542" font-size="24" font-weight="700">使われるかを先に見る</text>
  </g>
</svg>
