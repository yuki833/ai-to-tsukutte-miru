<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">公開でAIが止まったところを、人間が引き取った</title>
  <desc id="desc">AIがデータベース・設定・ビルドまで準備し、Cloudflareの認証と通信の制限で止まり、人間が端末で2つのコマンドを打ち、そのあとAIが本番URLや保存されたイベントを確認した、という4段の流れを示した図</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">HANDOVER</text>
  <text x="74" y="128" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">止まったところだけ、人間が引き取る</text>

  <g font-family="sans-serif">
    <rect x="74" y="176" width="1052" height="104" rx="18" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="112" y="218" fill="#7a7362" font-size="22" font-weight="700">1. AIがやった</text>
    <text x="112" y="256" fill="#24231f" font-size="27" font-weight="700">データベース・設定・ビルドまで準備する</text>

    <path d="M600 288 L600 306" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M591 298 L600 312 L609 298 Z" fill="#b8ae9a"/>

    <rect x="74" y="320" width="1052" height="104" rx="18" fill="#fdf6f3" stroke="#e2b3a4" stroke-width="2"/>
    <text x="112" y="362" fill="#d36542" font-size="22" font-weight="700">2. ここで止まった</text>
    <text x="112" y="400" fill="#24231f" font-size="27" font-weight="700">公開コマンド側の認証が通らず、通信も制限された</text>

    <path d="M600 432 L600 450" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M591 442 L600 456 L609 442 Z" fill="#b8ae9a"/>

    <rect x="74" y="464" width="1052" height="104" rx="18" fill="#24231f"/>
    <text x="112" y="506" fill="#e88a64" font-size="22" font-weight="700">3. 人間がやった</text>
    <text x="112" y="544" fill="#fff" font-size="27" font-weight="700">いつもの端末で、コマンドを2つ打つだけ</text>

    <path d="M600 576 L600 594" stroke="#b8ae9a" stroke-width="3" fill="none"/>
    <path d="M591 586 L600 600 L609 586 Z" fill="#b8ae9a"/>

    <rect x="74" y="606" width="1052" height="52" rx="16" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="600" y="640" text-anchor="middle" fill="#24231f" font-size="25" font-weight="700">4. AIへ戻す。本番URL・画面・保存されたイベントを確認する</text>
  </g>
</svg>
