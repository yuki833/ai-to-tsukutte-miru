<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Yohakuを最初のAIビジネスに選んだ理由</title><desc id="d">無料、登録不要、在庫なし、AIで改善しやすいという4条件から価格利益診断を選ぶ図</desc>
<rect width="1200" height="675" fill="#f6f2e9"/><text x="84" y="92" fill="#24231f" font-family="sans-serif" font-size="24" letter-spacing="4">WHY THIS PRODUCT?</text><text x="84" y="152" fill="#24231f" font-family="sans-serif" font-size="42" font-weight="700">最初のAIビジネスに「価格・利益診断」を選んだ理由</text>
<g font-family="sans-serif"><g fill="#fff" stroke="#d8d0bf" stroke-width="2"><rect x="84" y="220" width="235" height="190" rx="18"/><rect x="349" y="220" width="235" height="190" rx="18"/><rect x="614" y="220" width="235" height="190" rx="18"/><rect x="879" y="220" width="235" height="190" rx="18"/></g>
<g fill="#d36542" font-size="36" font-weight="700"><text x="112" y="275">01</text><text x="377" y="275">02</text><text x="642" y="275">03</text><text x="907" y="275">04</text></g>
<g fill="#24231f"><text x="112" y="325" font-size="27" font-weight="700">無料で開始</text><text x="112" y="365" font-size="20">固定費・AI API費</text><text x="112" y="394" font-size="20">ともに0円</text><text x="377" y="325" font-size="27" font-weight="700">登録不要</text><text x="377" y="365" font-size="20">6つの数字だけで</text><text x="377" y="394" font-size="20">すぐ試せる</text><text x="642" y="325" font-size="27" font-weight="700">在庫なし</text><text x="642" y="365" font-size="20">仕入れ・発送・保管</text><text x="642" y="394" font-size="20">が不要</text><text x="907" y="325" font-size="27" font-weight="700">改善しやすい</text><text x="907" y="365" font-size="20">数字と声を基にAIが</text><text x="907" y="394" font-size="20">小さく更新できる</text></g></g>
<path d="M600 438v55" stroke="#d36542" stroke-width="4"/><path d="M585 480l15 18 15-18" fill="none" stroke="#d36542" stroke-width="4"/><rect x="285" y="505" width="630" height="100" rx="50" fill="#24231f"/><text x="600" y="566" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="31" font-weight="700">Yohaku｜ひとり商売の価格・利益診断</text>
</svg>
