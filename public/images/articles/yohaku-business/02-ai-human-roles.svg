<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">AIと人間の役割分担</title><desc id="d">AIが調査制作計測改善を担当し、人間が目的判断認証公開承認を担当する図</desc><rect width="1200" height="675" fill="#f6f2e9"/><text x="84" y="92" fill="#24231f" font-family="sans-serif" font-size="24" letter-spacing="4">AI × HUMAN</text><text x="84" y="152" fill="#24231f" font-family="sans-serif" font-size="42" font-weight="700">「ほぼ自走」でも、人間の仕事はなくならない</text>
<rect x="84" y="215" width="480" height="350" rx="24" fill="#24231f"/><rect x="636" y="215" width="480" height="350" rx="24" fill="#fff" stroke="#d8d0bf" stroke-width="2"/><g font-family="sans-serif"><text x="124" y="270" fill="#e88a64" font-size="24" letter-spacing="4">AI</text><text x="124" y="315" fill="#fff" font-size="31" font-weight="700">速く繰り返す仕事</text><g fill="#fff" font-size="23"><text x="124" y="372">● 市場・競合の調査</text><text x="124" y="417">● 仕様・文章・コードの制作</text><text x="124" y="462">● テストと匿名計測</text><text x="124" y="507">● 数字から改善案を作る</text></g><text x="676" y="270" fill="#d36542" font-size="24" letter-spacing="4">HUMAN</text><text x="676" y="315" fill="#24231f" font-size="31" font-weight="700">責任を持って決める仕事</text><g fill="#24231f" font-size="23"><text x="676" y="372">● 目的・価値観・条件を決める</text><text x="676" y="417">● 認証と権限を確認する</text><text x="676" y="462">● 個人情報と公開内容を判断する</text><text x="676" y="507">● 外部発信を最終承認する</text></g></g><circle cx="600" cy="390" r="50" fill="#d36542"/><text x="600" y="402" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">×</text><text x="600" y="625" text-anchor="middle" fill="#24231f" font-family="sans-serif" font-size="24">AIが実行し、人間が方向と責任を持つ</text>
</svg>
