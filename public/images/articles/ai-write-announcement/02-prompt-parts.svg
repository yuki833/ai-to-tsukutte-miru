<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">指示文は読む人・目的・形・守ること・材料の5つの区画でできている。効くのは守ることの1つ目で、材料に無いことを書き足さないと先に決めている</title>
  <desc id="desc">お知らせ文をAIに書かせる指示文の構造を示した図。指示文は読む人、目的、形、守ること、材料の5つの区画からできている。読む人、目的、形の3つは体裁を整えるだけで中身の正しさには効かない。効くのは守ることの1つ目、材料に書いていないことを書き足さないという行で、日付・部署名・担当者名・理由・手続きを材料に無ければ書かないと先に決めている。材料の区画には箇条書きをそのまま貼る。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">PROMPT PARTS</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">効くのは「守ること」の1行目だけ</text>

  <g font-family="sans-serif">
    <rect x="74" y="182" width="500" height="80" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="104" y="232" fill="#5c534a" font-size="23">【読む人】全社員・事前説明なし</text>

    <rect x="74" y="278" width="500" height="80" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="104" y="328" fill="#5c534a" font-size="23">【目的】いつから何が変わるか</text>

    <rect x="74" y="374" width="500" height="80" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="104" y="424" fill="#5c534a" font-size="23">【形】件名＋番号付きの3点まで</text>

    <rect x="74" y="470" width="500" height="80" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="104" y="520" fill="#5c534a" font-size="23">【材料】箇条書きをそのまま貼る</text>

    <rect x="626" y="182" width="500" height="368" rx="20" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="658" y="234" fill="#2f6b4f" font-size="25" font-weight="700">【守ること】</text>
    <text x="658" y="292" fill="#24231f" font-size="23" font-weight="700">材料に無いことを書き足さない</text>
    <text x="658" y="330" fill="#2f6b4f" font-size="19" font-weight="700">← 効くのはここ</text>
    <text x="658" y="386" fill="#5c534a" font-size="21">日付・部署名・担当者名</text>
    <text x="658" y="420" fill="#5c534a" font-size="21">理由・手続き</text>
    <text x="658" y="474" fill="#5c534a" font-size="21">未定のものは未定と書く</text>
    <text x="658" y="512" fill="#5c534a" font-size="21">入れなかった材料を並べる</text>

    <text x="74" y="616" fill="#5c534a" font-size="21" font-family="sans-serif">上の3つは体裁を整えるだけで、中身の正しさには効きません</text>
  </g>
</svg>
