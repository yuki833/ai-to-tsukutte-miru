<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">この記事の前に読むのは議事録と要約の記事、あとに読むのは英文メールの記事、あわせて読むのは伏せ方の記事</title>
  <desc id="desc">次に読む記事の案内図。材料を集める段階で読むのは、議事録をAIに書かせる記事と、長い文章をAIに要約させる記事の2本。決まったことと決まっていないことを分けた議事録や、落ちたものを最後に並べさせる要約は、そのまま材料になる。この記事のあとに読むのは、英文メールをAIに翻訳させる記事で、書いてあることが相手にどう読まれるかの話。あわせて読むのは、社内の資料をAIに貼っていいのかという伏せ方の記事で、材料の箇条書きにも社名と金額はそのまま入る。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">WHAT NEXT</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">材料を集めるところから、送るところまで</text>

  <g font-family="sans-serif">
    <text x="74" y="196" fill="#5c534a" font-size="21" font-weight="700">材料を集める段階で読む</text>

    <rect x="74" y="216" width="500" height="120" rx="16" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="106" y="262" fill="#24231f" font-size="23" font-weight="700">議事録をAIに書かせる</text>
    <text x="106" y="304" fill="#5c534a" font-size="20">決まったことと決まっていないことを分ける</text>

    <rect x="626" y="216" width="500" height="120" rx="16" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="658" y="262" fill="#24231f" font-size="23" font-weight="700">長い文章をAIに要約させる</text>
    <text x="658" y="304" fill="#5c534a" font-size="20">落ちたものを最後に並べさせる</text>

    <text x="600" y="376" fill="#b7ac99" font-size="30" font-weight="700">↓</text>

    <rect x="74" y="396" width="1052" height="100" rx="16" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="106" y="442" fill="#2f6b4f" font-size="23" font-weight="700">この記事：材料を渡して書かせ、材料に無いことを並べさせる</text>
    <text x="106" y="478" fill="#5c534a" font-size="20">社内のお知らせ文</text>

    <text x="74" y="556" fill="#5c534a" font-size="21" font-weight="700">このあと・あわせて読む</text>

    <rect x="74" y="576" width="500" height="70" rx="16" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="106" y="620" fill="#24231f" font-size="22">英文メールをAIに翻訳させる</text>

    <rect x="626" y="576" width="500" height="70" rx="16" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="658" y="620" fill="#24231f" font-size="22">社名と金額を伏せて貼る</text>
  </g>
</svg>
