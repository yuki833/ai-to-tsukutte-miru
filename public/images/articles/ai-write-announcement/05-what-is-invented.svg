<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">材料に無いことを並べさせると、何も渡さない版から部署名・開始日・ルール・手続き・理由の5件が出る。読み返しても自然な日本語なので見つからない</title>
  <desc id="desc">書き上がった文を貼り直して、材料に書かれていないことを箇条書きで並べてと聞いた結果を示した図。何も渡さずに書かせた版からは5件が出た。総務部という部署名、来月1日という開始日、2週間前から受け付けるというルール、長時間は事前に相談という手続き、有効活用のためという理由。さらに、材料にあった7行のうちこの文に入っていたものは0行だった。この確かめ方の要点は文を読み返さないことで、読み返すと日本語の自然さのほうに目が行ってしまう。</desc>
  <rect width="1200" height="675" fill="#f6f2e9"/>
  <text x="74" y="74" fill="#d36542" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3">WHAT IS INVENTED</text>
  <text x="74" y="126" fill="#24231f" font-family="sans-serif" font-size="39" font-weight="700">何も渡さない版から、5件出ました</text>

  <g font-family="sans-serif">
    <rect x="74" y="182" width="1052" height="252" rx="20" fill="#fff" stroke="#d36542" stroke-width="3"/>
    <text x="106" y="228" fill="#d36542" font-size="21" font-weight="700">材料に書かれていないこと</text>
    <text x="106" y="278" fill="#24231f" font-size="23">・「総務部」という部署名</text>
    <text x="106" y="316" fill="#24231f" font-size="23">・「来月1日より」という開始日（材料は10月1日）</text>
    <text x="106" y="354" fill="#24231f" font-size="23">・「2週間前から受け付けます」というルール</text>
    <text x="106" y="392" fill="#24231f" font-size="23">・「長時間は事前に相談」という手続き</text>
    <text x="620" y="392" fill="#24231f" font-size="23">・「有効に活用するため」という理由</text>

    <rect x="74" y="458" width="512" height="104" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="106" y="498" fill="#5c534a" font-size="21">材料に無いのに書かれたもの</text>
    <text x="106" y="540" fill="#d36542" font-size="30" font-weight="700">5件</text>

    <rect x="614" y="458" width="512" height="104" rx="14" fill="#fff" stroke="#d8d0bf" stroke-width="2"/>
    <text x="646" y="498" fill="#5c534a" font-size="21">材料7行のうち、文に入っていたもの</text>
    <text x="646" y="540" fill="#d36542" font-size="30" font-weight="700">0行</text>

    <text x="74" y="624" fill="#24231f" font-size="24" font-weight="700">文は読み返しません。読み返すと、日本語の自然さに目が行きます</text>
  </g>
</svg>
